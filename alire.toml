name = "aa_stm32_drivers"
description = "Linux UART backend for the STM32 drivers API"
version = "0.1.0-dev"

authors = ["Max Reznik"]
maintainers = ["Max Reznik <reznikmm@gmail.com>"]
maintainers-logins = ["reznikmm"]
licenses = "Apache-2.0 WITH LLVM-exception"
website = "https://github.com/reznikmm/aa_stm32_drivers"
tags = ["linux", "drivers", "uart"]

project-files = ["gnat/aa_stm32_drivers.gpr"]

[build-switches]
development.optimization = ["-O2"]
development.style_checks = ["-gnaty"]
development.contracts = "Yes"
"*".debug_info = "Yes"

[[depends-on]]
a0b_callbacks = "~0.2.0"

[[actions]]
type = "test"
command = ["alr", "-n", "-C", "demos/linux", "build"]

[[actions]]
type = "test"
command = ["alr", "-n", "exec", "--", "gprbuild", "-P", "tests/uart_tests.gpr"]

[[actions]]
type = "test"
command = ["tests/bin/test_uart"]

[[actions]]
type = "test"
command = ["tests/bin/workers_tests"]
